<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="css\styles.css">
</head>
<body>
    <h1>Lista de tareas</h1>
    <div class="wrapper">
        <form action="">
            <input id="tareasInput" type="text" placeholder="Escribe algo para agregarlo" autocomplete="off">
            <button id="botonAñadir">Añadir</button>
        </form>
        <ul id="tareasLista">
            <li class="tarea">
                <input type="checkbox" id="tarea-1">
                <label class="checkboxPersonalizado" for="tarea-1"></label>
                <label class="tareaTexto" for="tarea-1">
                    placeholder
                </label>
                <button class="tareaBorrar">
                    <svg fill="var(--secundary-color)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f">
                        <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                    </svg>
                </button>
            </li>
        </ul>
    </div>
    <script src="scripts\script.js"></script>
</body>
</html>
